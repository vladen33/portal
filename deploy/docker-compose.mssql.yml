# MS SQL Server для проверки функций, зависящих от СУБД.
#
# Запуск (из корня проекта, чтобы compose нашёл .env):
#   docker compose -f deploy/docker-compose.mssql.yml up -d
# Остановка:
#   docker compose -f deploy/docker-compose.mssql.yml down
#
# Пароль SA задаётся в .env (MSSQL_SA_PASSWORD) и должен
# соответствовать политике SQL Server: не короче 8 символов,
# заглавные и строчные буквы, цифры и спецсимвол.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: portal-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Задайте MSSQL_SA_PASSWORD в .env}"
      # Express — бесплатная редакция, допустимая в production.
      # Developer (было раньше) лицензией для production запрещена.
      # Лимиты Express: 10 ГБ на базу, 1 ГБ RAM, 4 ядра.
      MSSQL_PID: "Express"
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports:
      # Порт открыт только на localhost: база не видна в сети.
      # MSSQL_HOST_PORT позволяет занять другой порт, если 1433
      # уже используется (например, другим сервисом).
      - "127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433"
    # Контейнеру достаточно памяти Express-редакции.
    mem_limit: 2g
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 2 bash -c '</dev/tcp/127.0.0.1/1433'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
