# nginx для портала СМК: TLS, статика и прокси на gunicorn.
#
# Файлы редакций (MEDIA_ROOT) намеренно НЕ раздаются как статика:
# их отдаёт Django после проверки входа (RevisionFileView).
# Каталог media должен лежать вне web-root nginx.

upstream portal_ksmk {
    server unix:/run/portal-ksmk/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name portal.example.local;

    # Заглушка для продления сертификата Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.example.local;

    ssl_certificate     /etc/ssl/certs/portal.example.local.pem;
    ssl_certificate_key /etc/ssl/private/portal.example.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Размер одной загружаемой редакции документа.
    client_max_body_size 50m;

    # Статику собирает collectstatic, nginx отдаёт её напрямую.
    location /static/ {
        alias /srv/portal-ksmk/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Файлы редакций: отдаёт Django, буферизация выключена,
    # чтобы большие файлы шли потоком и фиксировался просмотр.
    location ~ ^/documents/.*/file/$ {
        proxy_pass http://portal_ksmk;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://portal_ksmk;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
